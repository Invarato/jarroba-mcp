name: scorecard
# OpenSSF Scorecard: checks this repository's supply-chain practices (pinned actions, token permissions,
# branch protection, signed releases…) and publishes the score and badge. Free for public repositories.
# The results are NOT uploaded as code-scanning alerts: every low check of a one-person project (no reviewers,
# under 90 days, intended .wasm files…) became a permanent "High" alert that buried the real ones. The details
# are at https://scorecard.dev/viewer/?uri=github.com/Invarato/jarroba-mcp
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  branch_protection_rule:
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
