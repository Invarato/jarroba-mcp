name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # The packages run on the user's machine, so they are tested where users run them: Linux, Windows and macOS,
    # on every Node version the packages declare (engines: >=22). Free for public repositories.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - working-directory: mcp
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
          npm run test:paquete
      - name: MCP conformance (official MCP Inspector, as any client would see the server)
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        working-directory: mcp
        run: node scripts/conformidad.mjs
